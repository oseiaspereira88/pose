# Gitleaks config (spec pose-ossf-security-baseline). Extends every default
# rule; the allowlist below is a documented, owned exception for a single
# historical commit, not a relaxation of any detection rule.
title = "POSE gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Two documented, owned exceptions. (1) b6d4a72: TestSecretsRedaction (internal/observability, spec pose-otel-observability) used an inline PEM-shaped literal to test the redaction function. Not a real key — the body is the literal placeholder 'MIIB...'. The literal was split across concatenated strings in a later commit so the shape no longer appears in the file, but the original commit remains in history. (2) The regexes below exempt non-secret identifiers that the generic-api-key rule matches on the word 'key': the public SonarQube project identifier (sonar-project.properties and the scanner logs that echo it, spec pose-sonarqube-validation) and the project-state refresh dedup hash (.pose/state/refresh-log.jsonl, spec pose-project-state-refresh-contract). Both are content-scoped, not path-scoped: any other finding in those files still fails the gate."
commits = [
  "b6d4a72534fa8834c7dd67888f48a1eb8efd3966",
]
regexTarget = "line"
regexes = [
  '''sonar\.projectKey=proj\.harne8\.[a-z0-9._-]+''',
  '''[Pp]roject key: proj\.harne8\.[a-z0-9._-]+''',
  '''component key: 'proj\.harne8\.[a-z0-9._-]+''',
  '''"dedup_key":"[0-9a-f]{16}"''',
]

# The agent-sync cache is a local file→SHA-256 manifest. It was swept into
# acff2e5 (v1.7.1 prep) by accident and is untracked from that point on, but
# git-mode scanning reads history, so the blob stays reachable forever and
# generic-api-key keeps matching entries whose path ends in a credential-ish
# word ("...auth.py":"<digest>"). Every release from v1.7.1 to v1.7.10 failed
# on exactly this finding (spec pose-release-security-gate-integrity).
#
# The exception is rule-scoped and conjunctive: it applies only inside that
# one file AND only to entries whose value is a bare 64-char lowercase hex
# digest. A real credential in the same file — different shape — still fails,
# and the shape alone is not exempt anywhere else in the repository.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Path→SHA-256 entries of the historical .harne8-agent-sync.json blob (see note above)."
  condition = "and"
  paths = ['''^\.harne8-agent-sync\.json$''']
  regexTarget = "line"
  regexes = ['''"[^"]+":"[0-9a-f]{64}"''']
