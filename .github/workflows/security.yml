# Security baseline (spec pose-ossf-security-baseline): static analysis,
# dependency review and secret detection run on every pull request; pushes to
# main and a weekly schedule keep the baseline current. Third-party actions
# are pinned by commit SHA; first-party tag pins are a documented, expiring
# exception (.github/security-exceptions.json).
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
permissions: { contents: read }
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.6", cache: false }
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: go
          # autobuild (not manual): manual build-mode relies on tracing a
          # `go build` invocation this workflow runs itself, which failed
          # ("CodeQL could not process any code written in Go") even with
          # the module/build cache disabled — the real compiler
          # invocation was still not observed. autobuild lets the
          # codeql-action drive the build directly through its own
          # tracer, which is the mode GitHub recommends for Go.
          build-mode: autobuild
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: codeql-go
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.6", cache: true, cache-dependency-path: pose-mcp/go.mod }
      - name: Known-vulnerability scan (module versions pinned, sumdb-authenticated)
        run: |
          go -C pose-mcp run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          go -C mcp-enforce run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.6", cache: true, cache-dependency-path: pose-mcp/go.mod }
      - name: Secret detection over full git history (redacted output)
        run: go -C pose-mcp run github.com/zricethezav/gitleaks/v8@v8.21.2 git --no-banner --redact --config ../.gitleaks.toml ..
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
  workflow-contract:
    # R2: permissions and action pinning are checked automatically by the
    # same contract-test mechanism that guards the version and catalog.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.6", cache: true, cache-dependency-path: pose-mcp/go.mod }
      - run: go -C pose-mcp test ./internal/version -run 'WorkflowSecurity' -count=1
  validation-findings:
    # Deterministic validation results reach code scanning as SARIF, so a
    # failing required check is visible next to CodeQL's findings instead of
    # only in a job log (spec pose-governance-gate-activation, R7).
    # Tolerant on purpose: the strict gate already fails the CI workflow; this
    # job exists to publish findings, not to duplicate that failure.
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.6", cache: true, cache-dependency-path: pose-mcp/go.mod }
      - name: Deterministic validation to SARIF
        run: go -C pose-mcp run ./cmd/pose validate --tolerant --sarif .pose/reports/validation.sarif
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: .pose/reports/validation.sarif
          category: pose-validation
