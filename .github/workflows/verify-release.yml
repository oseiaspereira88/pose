# Independent release verification (spec pose-reproducible-release-verification):
# a consumer-side job with no producer state — no shared caches, no elevated
# credentials — downloads the published release, authenticates signature,
# provenance, checksum and SBOM, executes only after verification and
# attempts a controlled rebuild. Runs automatically when a release is
# published and on demand for any tag.
name: Verify release
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (vX.Y.Z)"
        required: true
permissions: { contents: read, attestations: read }
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      # Under workflow_run this job runs in the base-repository context, so
      # checking out an event-supplied ref is the pattern Scorecard flags as a
      # dangerous workflow. The job holds only read scopes and no secrets, but
      # the ref is still attacker-influenceable, so it is resolved to a tag that
      # matches the release pattern and nothing else
      # (spec pose-release-workflow-hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve and check out the release tag
        env:
          RAW_REF: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$RAW_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to verify a ref that is not a release tag: $RAW_REF" >&2; exit 1 ;;
          esac
          git fetch --depth 1 origin "refs/tags/$RAW_REF:refs/tags/$RAW_REF"
          git checkout --detach "refs/tags/$RAW_REF"
          # Every later step reads the validated tag from the environment; the
          # raw event value is never interpolated into a script again.
          echo "RELEASE_TAG=$RAW_REF" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false # verifier must not reuse producer caches
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Independent verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/release/independent-verify.sh "$RELEASE_TAG"
      - name: Documented installs resolve to published assets
        # pose.rb was a copyable brew command in the docs for four releases
        # while never being uploaded, so the URL 404'd and nothing compared the
        # two sides (spec pose-docs-asset-parity).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/release/docs-asset-parity.sh "$RELEASE_TAG"
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pose-verification-report
          path: verification-report.md
          retention-days: 400
