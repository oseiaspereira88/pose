# Clean-host package-manager install verification (spec
# pose-package-manager-distribution, R3): installs the real published
# release through the generated Homebrew formula and WinGet manifest on
# unmodified macOS and Windows runners — no shared state with the release
# job, no local build shortcuts — then exercises the installed binary.
name: Package channels
on:
  # `release: published` never fires for a release created by the workflow's own
  # GITHUB_TOKEN, so this gate had zero runs across every release the project
  # had cut. workflow_run is the trigger that actually fires, the same one
  # verify-release.yml relies on (spec pose-package-channel-delivery).
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (vX.Y.Z)"
        required: true
permissions: { contents: read }
jobs:
  package-channels:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Under workflow_run this job runs in the base-repository context, so the
      # event-supplied ref is attacker-influenceable: checking it out, or
      # interpolating it into a shell script, is what Scorecard flags as a
      # dangerous workflow. It is resolved once, against the release-tag
      # pattern, and reaches every later step as an environment variable
      # instead of as template text (spec pose-package-channel-workflow-safety).
      - name: Resolve the release tag
        shell: bash
        env:
          RAW_REF: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$RAW_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to build channels for a ref that is not a release tag: $RAW_REF" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$RAW_REF" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Download release checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --repo "$REPO" --pattern checksums.txt
      - name: Generate package-manager manifests
        shell: bash
        run: |
          set -euo pipefail
          # The Go module lives in pose-mcp/, not at the repository root: the
          # previous form failed in 26s on both runners with "cannot find main
          # module" the one time this gate was ever dispatched.
          go -C pose-mcp run ./cmd/pose release-package-manifests \
            --version "${RELEASE_TAG#v}" \
            --checksums ../checksums.txt \
            --out ../package-manifests
      - name: Install via Homebrew
        if: runner.os == 'macOS'
        shell: bash
        # Homebrew rejects a formula that is not in a tap — installing from a
        # path or a URL is no longer supported, and HOMEBREW_DEVELOPER is
        # explicitly unsupported too. The formula therefore goes into a
        # throwaway local tap, which is the same shape a published tap has, so
        # the gate exercises the formula the release actually ships
        # (spec pose-package-channel-install-repair).
        run: |
          set -euo pipefail
          brew tap-new --no-git harne8/local
          tap="$(brew --repository harne8/local)"
          mkdir -p "$tap/Formula"
          cp package-manifests/homebrew/pose.rb "$tap/Formula/pose.rb"
          brew install --formula harne8/local/pose
          pose doctor --json
          brew uninstall pose
      - name: Install via WinGet
        if: runner.os == 'Windows'
        shell: pwsh
        # Installing from a local manifest is off by default and has to be
        # enabled by an administrator; without it winget prints its help and
        # exits 1, which reads like a usage error rather than a disabled
        # feature (spec pose-package-channel-install-repair).
        run: |
          winget settings --enable LocalManifestFiles
          # The msstore source demands its own agreements even for an install
          # that never touches it, and cancels the operation after the download
          # has already succeeded. This install reads a local manifest, so the
          # source is removed rather than agreed to.
          winget source remove --name msstore
          if ($LASTEXITCODE -ne 0) { Write-Host "msstore source already absent" }
          $global:LASTEXITCODE = 0
          winget validate --manifest .\package-manifests\winget
          winget install --manifest .\package-manifests\winget --accept-package-agreements --accept-source-agreements --disable-interactivity
          pose doctor --json
          winget uninstall --id Harne8.Pose --disable-interactivity
