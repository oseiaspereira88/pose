name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.5", cache: true, cache-dependency-path: pose-mcp/go.mod }
      - name: Go tests (engine drift guard included)
        run: go -C pose-mcp test ./... -count=1
      - name: Shellcheck
        # Covers every shipped or executed script, not just the installer.
        # tests/release/ was outside this list until v0.20.2, and three
        # consecutive releases failed on defects there — two of them SC2154,
        # a variable referenced but never assigned, which aborts under set -u
        # after the expensive gates have already run
        # (spec pose-shellcheck-ci-gate).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            install.sh \
            scripts/*.sh \
            tests/*.sh \
            tests/*/*.sh
      - name: Installer E2E
        run: bash tests/install/run.sh
      - name: Artifact-identity gate rejects what it must (spec pose-release-signing R3)
        run: bash tests/release/verify-negative.sh
      - name: Recorded action runtimes match the actions themselves
        # The offline check reads the runtime record; this resolves each action
        # at its pinned ref, so the record cannot quietly disagree with reality
        # (spec pose-action-runtime-currency-gate).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/release/action-runtime-verify.sh
  governance:
    # Dogfood gate (spec pose-standalone-dogfood): the standalone instance
    # must pass its own structural/validation gates with an explicitly
    # identified development build, and CI retains the evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.5", cache: true, cache-dependency-path: pose-mcp/go.mod }
      - name: Build development pose binary
        run: |
          go -C pose-mcp build -o "$RUNNER_TEMP/pose" ./cmd/pose
          "$RUNNER_TEMP/pose" version
      - name: Structural gate (pose check --strict)
        run: '"$RUNNER_TEMP/pose" check --strict'
      - name: Agent Skills conformance (spec pose-agent-skills-conformance)
        run: '"$RUNNER_TEMP/pose" skills-check --strict'
      - name: History gate (pose history-check)
        run: '"$RUNNER_TEMP/pose" history-check'
      - name: Retain governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pose-governance-evidence
          path: |
            .pose/reports/
            .pose/indexes/spec-graph.json
            .pose/indexes/roadmaps.json
          if-no-files-found: warn
          retention-days: 90
