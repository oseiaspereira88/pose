<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- POSE brand mark: agents orbiting a verified core (final) -->
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#22d3ee" flood-opacity="0.4"/>
    </filter>
  </defs>
  <ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(26 32 32)"
           stroke="url(#orb1)" stroke-width="2.6"/>
  <ellipse cx="32" cy="32" rx="24" ry="8" transform="rotate(-38 32 32)"
           stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
  <circle cx="55.2" cy="37.8" r="2.6" fill="#22d3ee"/>
  <circle cx="12.5" cy="43.7" r="2.2" fill="#8b5cf6"/>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="12.5" fill="url(#core)"/>
    <path d="M26 32.5 L30.5 37 L38.5 27" stroke="#ffffff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
